<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/hsv/fonts/k2d-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/hsv/fonts/k2d-500-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nền tảng sự kiện của Hội Sinh viên Trường Đại học Kỹ thuật – Công nghệ Cần Thơ."
    />
    <title>Sự kiện Hội Sinh viên CTUT</title>
    <script>
      (function () {
        var u = new URL(location.href);
        var route = u.searchParams.get("__spa");
        if (route && route.startsWith("/hsv/") && !route.includes("\\") && !/[\r\n]/.test(route))
          history.replaceState(null, "", route);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
